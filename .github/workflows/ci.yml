# CI for tap-plugin-grid-fixtures.
#
# A thin caller. All the logic lives in the reusable workflow in the core TAP repo
# (`.github/workflows/plugin-ci.yml`, req-plugin-extdev-repo-ci) so every plugin repo —
# ours and external developers' — runs the SAME admission gate, and improving it is one
# edit in one place rather than a fan-out across a dozen repos.
#
# Two prerequisites, both easy to get wrong and both silent when wrong:
#
#  1. The core repo is PRIVATE, so its reusable workflows must be shared:
#     Settings > Actions > General > Access = "Accessible from repositories owned by
#     the user 'notgeorge'". Without it every run fails with a workflow-not-found error.
#  2. `harness_pat` must be a PAT with Contents:Read on notgeorge/tap. The caller's own
#     GITHUB_TOKEN is scoped to THIS repo and cannot check out core. This is deliberately
#     NOT the `github-plugins-ro` token, which reads plugin repos and must not read core.
#
# `boot_profile` is intentionally omitted: grid_fixtures is a leaf with no cross-plugin
# dependencies, so the Django-free conformance job is the whole gate here. Plugins that
# need a real stack pass a profile and opt into the boot-and-test job.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs matter for a plugin repo: core can regress the plugin without a single
  # commit landing HERE, and nothing else would re-run this gate.
  workflow_dispatch:

jobs:
  tap:
    uses: notgeorge/tap/.github/workflows/plugin-ci.yml@main
    with:
      plugin_slug: grid_fixtures
      # Pinned deliberately. `main` means "whatever core is today", which turns an
      # unrelated core change into a surprise red here. Bump this on purpose.
      harness_ref: main
    secrets:
      harness_pat: ${{ secrets.TAP_CORE_RO_PAT }}
